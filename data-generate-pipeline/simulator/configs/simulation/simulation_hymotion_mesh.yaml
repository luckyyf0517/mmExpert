data_source: hunyuan_wooden
data_pattern: ${MMEXPERT_DATA_ROOT}/step2/hunyuan_motion/*.npz
output_dir: ${MMEXPERT_DATA_ROOT}/step3/udoppler_mesh
# The HY-Motion body model assets are resolved from the pinned submodule.

fps: 30
mesh_sample_rate: 24
wooden_batch_size: 8
wooden_smooth_sigma: 1.0
scale: 1.0

simulation_method: pytorch
num_rotations: 1
output_mode: udoppler

start: 0
end: -1
skip_exist: false

num_antenna: 1
radar_config: configs.radar.iwr1843_udoppler

camera_orientation: [0.0, 0.0, 0.0]
camera_position: [-5.6, 0.0, 1.0]
simulation_bounds:
  x: [-5.0, 5.0]
  y: [-5.0, 5.0]
  z_max: 1.0

verbose: true
