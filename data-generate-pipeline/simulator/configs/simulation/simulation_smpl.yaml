data_source: smpl
data_pattern: ${MMEXPERT_DATA_ROOT}/smpl/*.npy
output_dir: ${MMEXPERT_DATA_ROOT}/udoppler
smpl_model_path: ${SMPL_MODEL_PATH}
device: cuda

mesh_sample_rate: 50
scale: 1.0

simulation_method: pytorch
num_rotations: 1
output_mode: udoppler

start: 0
end: -1
skip_exist: false

num_antenna: 1
radar_config: configs.radar.iwr1843_udoppler

camera_orientation: [0.0, 0.0, 0.0]
camera_position: [-5.6, 0.0, 1.0]
simulation_bounds:
  x: [-5.0, 5.0]
  y: [-5.0, 5.0]
  z_max: 1.0

verbose: true
