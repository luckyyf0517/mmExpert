# SigLIP model configuration - identical to CLIP except for loss function
target: src.model.clip.CLIP
params:
  max_epochs: 50
  learning_rate: 1.0e-04
  temperature: 0.10
  use_siglip: true

  # SigLIP loss configuration
  loss_dist_impl: "bidir"
  local_loss: false
  gather_with_grad: false

  encoder_configs:
    radar:
      encoder_type: "radar_encoder_vit"
      embed_dim: 768
      dropout: 0.1
      vit_model: "vit_small_patch16_224.augreg_in21k"
      pretrained: true
      freeze_backbone: false
      use_layer_norm: true
      patch_size_range: [32, 16]
      patch_size_other: [16, 16]
      max_sequence_length: 248

    text:
      model_name: 'sentence-transformers/all-mpnet-base-v2'
      embed_dim: 768
      max_length: 77
      pooling_strategy: 'pooler'
      freeze_backbone: false
      unfreeze_last_layers: 1