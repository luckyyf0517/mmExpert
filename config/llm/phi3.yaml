# Configuration for fine-tuning Phi3 with mmwave features

model_cfg:
  model_type: phi3
  use_peft: true

  model:
    model_path: "huggingface/models--microsoft--Phi-3-mini-4k-instruct/snapshots/0a67737cc96d2554230f90338b163bc6380a2a85"
    model_max_length: 2048

  peft_config:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: "none"
    auto_find_target_modules: true  # Auto-find all linear layers (except lm_head and multimodal modules)
    multimodal_keywords: ["mm_projection"]  # Exclude these keywords from LoRA

  conversation_template: "conv_phi3"
  mm_use_wave_start_end: true
  wave_token_len: 248

data_cfg:
  model_path: "huggingface/models--microsoft--Phi-3-mini-4k-instruct/snapshots/0a67737cc96d2554230f90338b163bc6380a2a85"
  model_max_length: 2048
  split: "train_QAs"

  # Must match model_cfg
  conversation_template: "conv_phi3"
  mm_use_wave_start_end: true
  wave_token_len: 248

training:
  learning_rate: 5e-4
  weight_decay: 0.0
  warmup_steps: 100

log_dir: "output/phi3"